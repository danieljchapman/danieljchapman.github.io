name: Early-vote counts

# Pulls the Secretary of State's daily early-voting turnout by county for the Nov 3, 2026 general election
# into data/ev_2026.csv and data/ev_status.json, using large counties' own daily reports where they are ahead of
# the state's file (tools/ev_counties.py: Harris, Dallas, Tarrant, Travis, Collin, El Paso). The state posts each day's numbers the next morning;
# this checks every hour from Oct 14 to Nov 3 and commits only when the counts change.
on:
  schedule:
    - cron: '23 * 14-31 10 *'
    - cron: '23 * 1-3 11 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: early-vote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the PDF and spreadsheet readers (county daily reports)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q openpyxl
      - name: Fetch early-vote counts
        run: |
          mkdir -p /tmp/ev
          python3 tools/ev_live.py /tmp/ev
          if cmp -s /tmp/ev/ev_2026.csv data/ev_2026.csv; then echo "No new counts"; exit 0; fi
          rows=$(($(wc -l < /tmp/ev/ev_2026.csv) - 1)); echo "rows: $rows"
          if [ "$rows" -lt 254 ]; then echo "Too few rows; not publishing"; exit 1; fi
          cp /tmp/ev/ev_2026.csv /tmp/ev/ev_status.json data/
          bash tools/publish_live.sh "Update 2026 early-vote counts" data/ev_2026.csv data/ev_status.json

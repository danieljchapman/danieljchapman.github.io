name: KS election-night results

# Kansas polls close at 7 pm local time: 7 pm Central (01:00 UTC Nov 4), 7 pm Mountain (02:00 UTC) in the four western counties on
# Mountain time; a county may keep its polls open until 8 pm.
# Every 5 minutes from 00:45 to 07:05 UTC Nov 4 (6:45 pm – 1:05 am Central) in one long job; two start times in case
# GitHub starts the first late (the second waits behind it and ends at once if the window is covered).
# After that: every 10 minutes until 11:50 UTC, then hourly through Nov 20 while counties finish.
# Source: CivicAPI (ks/tools/ks_live.py); the Secretary of State's site answers only a real browser.
on:
  schedule:
    - cron: '45 0 4 11 *'
    - cron: '15 1 4 11 *'
    - cron: '*/10 7-11 4 11 *'
    - cron: '43 12-23 4 11 *'
    - cron: '43 * 5-20 11 *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Test run: how many minutes to keep updating (0 = one update)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: ks-election-night
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Update
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
          SCHED: ${{ github.event.schedule }}
        run: |
          case "$SCHED" in
            '45 0 4 11 *'|'15 1 4 11 *') end=$(date -u -d '2026-11-04T07:05:00Z' +%s) ;;
            '') if [ "${MINUTES:-0}" = "0" ]; then bash ks/tools/fetch_live.sh; exit $?; fi
                end=$(( $(date +%s) + MINUTES * 60 )) ;;
            *) bash ks/tools/fetch_live.sh; exit $? ;;
          esac
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s); n=$((n + 1))
            echo "::group::Update $n at $(date -u +%H:%M:%S) UTC"
            bash ks/tools/fetch_live.sh || echo "::warning::Update $n failed"
            echo "::endgroup::"
            wait=$(( 300 - ($(date +%s) - start) ))
            [ $(( $(date +%s) + wait )) -ge "$end" ] && break
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
          echo "Finished after $n updates"

name: us-fetch
on:
  push:
    branches: [us-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources
        run: |
          mkdir -p fetched
          cd fetched
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -m 300 -o gaz_cd119.zip https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer/2024_Gaz_119CDs_national.zip || true
          curl -sSL -m 300 -o gaz_cd118.zip https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2023_Gazetteer/2023_Gaz_118CDs_national.zip || true
          ls -la gaz_*
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git rm -rq --cached fetched/fec_2024.xlsx fetched/fec_2024_results.xlsx || true; rm -f fec_2024.xlsx fec_2024_results.xlsx; git add fetched; git commit -m "fetched sources" || true; git push

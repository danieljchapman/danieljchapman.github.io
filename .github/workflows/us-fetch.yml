name: us-fetch
on:
  push:
    branches: [us-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources
        run: |
          mkdir -p fetched
          cd fetched
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for pg in 2024_Delaware_gubernatorial_election 2024_Indiana_gubernatorial_election 2024_Missouri_gubernatorial_election 2024_Montana_gubernatorial_election 2024_New_Hampshire_gubernatorial_election 2024_North_Carolina_gubernatorial_election 2024_North_Dakota_gubernatorial_election 2024_Utah_gubernatorial_election 2024_Vermont_gubernatorial_election 2024_Washington_gubernatorial_election 2024_West_Virginia_gubernatorial_election; do
            curl -sSL -A "election-dashboard/1.0 (danieljchapman.github.io)" -m 120 -o "wiki_$pg.json" "https://en.wikipedia.org/w/api.php?action=parse&page=$pg&prop=wikitext&format=json&formatversion=2&redirects=1" || true
            sleep 2
          done
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git rm -rq --cached fetched/fec_2024.xlsx fetched/fec_2024_results.xlsx || true; rm -f fec_2024.xlsx fec_2024_results.xlsx; git add fetched; git commit -m "fetched sources" || true; git push

name: Election-night results

# Pulls unofficial 2026 Texas results from the Texas Secretary of State and county election offices
# (Clarity, Harris County Clerk, Collin County) into data/live_2026.csv and
# data/live_status.json, and commits them so GitHub Pages republishes the site.
on:
  schedule:
    # Every 10 minutes, Nov 3 7:00 pm to Nov 4 6:00 am Central (CST, UTC-6 after Nov 1).
    # Backup for the 5-minute job (election-night-fast.yml): skips if results were updated in the last 8 minutes.
    - cron: '*/10 1-11 4 11 *'
  workflow_dispatch: {}   # "Run workflow" button, for tests and manual refreshes

permissions:
  contents: write

concurrency:
  group: election-night
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the 5-minute job already updated recently
        id: fresh
        run: |
          age=$(python3 -c "import json,datetime; s=json.load(open('data/live_status.json'))[0]; t=datetime.datetime.fromisoformat(s['updated_at'].replace('Z','+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()))" 2>/dev/null || echo 99999)
          echo "latest update is ${age}s old"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 480 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Install the PDF reader (Harris County) and a headless browser (Clarity's bot check)
        if: steps.fresh.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q playwright==1.47.0
          python3 -m playwright install --with-deps chromium >/dev/null

      - name: Fetch, check and publish results
        if: steps.fresh.outputs.skip != '1'
        run: bash tools/fetch_live.sh

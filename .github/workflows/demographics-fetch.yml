name: Demographics fetch (one-off, branch only)
# Side-branch helper for one-off downloads; nothing here touches the website.
on:
  push:
    branches: [demographics-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p demo
          curl -sS -L -m 60 -A "Mozilla/5.0" https://epcountyvotestx.gov/voter-information/current-election -o /tmp/ep.html
          grep -oE 'href="[^"]+"' /tmp/ep.html | grep -iE 'pdf|stat|xlsx|csv' > demo/ep_links.txt || true
          wc -l demo/ep_links.txt
      - name: Commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add demo && git commit -m "El Paso link list" && git push

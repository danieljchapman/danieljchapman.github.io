name: Demographics fetch (one-off, branch only)
# Downloads county demographics for a draft analysis. Runs only on this branch; nothing here touches the website.
on:
  push:
    branches: [demographics-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -x; mkdir -p demo
          V=NAME,B01003_001E,B03002_001E,B03002_003E,B03002_004E,B03002_006E,B03002_012E,B19013_001E
          for y in 2024 2023; do
            curl -sS -m 120 -o demo/acs_$y.json "https://api.census.gov/data/$y/acs/acs5?get=$V&for=county:*&in=state:48" && head -c 300 demo/acs_$y.json && break
          done
          curl -sS -L -m 120 -o demo/nchs_urb_rural.csv https://www.cdc.gov/nchs/data/data-analysis/NCHSurb-rural-codes.csv || true
          head -3 demo/nchs_urb_rural.csv || true
          curl -sS -L -m 120 -o demo/rucc2023.csv https://ers.usda.gov/sites/default/files/_laserfiche/DataFiles/53251/Ruralurbancontinuumcodes2023.csv || true
          head -3 demo/rucc2023.csv || true
          curl -sS -m 120 -o demo/area.json "https://api.census.gov/data/2020/dec/dhc?get=NAME,P1_001N&for=county:*&in=state:48" || true
          ls -la demo
      - name: Commit
        run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add demo && git commit -m "Demographic source files (draft analysis)" && git push

                    <uib-tab ng-repeat="t in vm.tabs" index="$index" heading="{{t.heading}}" params="{ tabId: t.tabId }" select="go(t.route, t.tabId, t.headingLong, $index); send(); vm.tabSelected(t.route, $index);" ui-sref="{{t.route}}" class="enr-nav-tab">
                    </uib-tab>

                    <div class="navbar-collapse pull-right" ng-if="vm.IsPrimary || vm.IsPpe">
                        <ul class="nav navbar-nav enr-navbar" ng-hide="{{vm.eid == '53' || vm.eid == '79'}}">
                            <li>
                                <form id="partyFilter">
                                    <select id="party" class="party-filter" ng-model="vm.party" ng-change="vm.setPartyFilter()">
                                        <option value="">{{vm.translation.AllParties}}</option>
                                        <option ng-repeat="p in vm.partyList" value="{{p.Id}}">{{p.Name}}</option>
                                    </select>
                                </form>
                            </li>
                        </ul>
                    </div>
                </uib-tabset>

                <div id="electionMessage" ng-if="vm.IsPreElectionMode" class="row" ng-cloak="">
                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <div class="panel panel-default box-shadow-3dp">
                            <div class="panel-body">
                                <div class="row">
                                    <div class="col-xs-12 col-sm-12 col-md-12 text-center">
                                        <span class="font-120">
                                            {{vm.NoResultsMessage !== "" ? vm.NoResultsMessage : vm.translation.NoResults}}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!--<div ui-view="featured" ng-show="vm.jid != '14'"></div>-->
            <div ui-view="featured"></div>
            <div ui-view="myraces"></div>
            <div ui-view=""></div>
        </div>
    </div>

    <div class="scroll-top-wrapper circle h3 visible-md visible-lg">

  <script>
    // Establish the base href dynamically
    (function() {
      console.log('Starting to set the base href...');
      var base = document.createElement('base');
      var parts = window.location.pathname.split('/').filter(Boolean); // Remove empty slashes

      console.log('Pathname parts:', parts);

      // Build the baseHref
      var baseHref = '/';
      if (parts.length >= 1) {
        baseHref += parts[0] + '/'; // State
        console.log('Adding state to baseHref:', baseHref);
      }
      if (parts.length >= 2) {
        baseHref += parts[1] + '/'; // County if present
        console.log('Adding county to baseHref:', baseHref);
      }

      base.href = baseHref;
      document.head.appendChild(base);
      console.log('Base href set:', baseHref);
    })();

    // Dynamically load state and county-specific CSS
    window.onload = function() {
      console.log('Starting dynamic CSS loading...');

      var parts = window.location.pathname.split('/').filter(Boolean); // Remove empty slashes
      console.log('Pathname parts for CSS:', parts);

      var STATE = parts[0]; // The first element will always be the state
      var COUNTY = parts.length > 1 ? parts[1] : null; // County if present

      console.log('Detected state:', STATE);
      console.log('Detected county:', COUNTY);

      if (STATE) {
        var linkEntityState = document.createElement('link');
        linkEntityState.href = 'skins/' + STATE + '/css/skin.css';
        linkEntityState.type = "text/css";
        linkEntityState.rel = "stylesheet";
        document.head.appendChild(linkEntityState);
        console.log('Loading CSS for state:', linkEntityState.href);
      }

      if (STATE && COUNTY) {
        var linkEntity = document.createElement('link');
        linkEntity.href = 'skins/' + STATE + '/' + COUNTY + '/css/skin.css';
        linkEntity.type = "text/css";
        linkEntity.rel = "stylesheet";
        document.head.appendChild(linkEntity);
        console.log('Loading CSS for county:', linkEntity.href);
      }

      console.log('CSS loading completed.');
    }
